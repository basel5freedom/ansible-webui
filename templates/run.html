{% extends "base.html" %}
{% block title %}実行 - Ansible WebUI{% endblock %}
{% block content %}
<h1>Playbook実行</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/run" id="run-form">
  <label>カテゴリ / Playbook
    <select id="playbook_select">
      {% for cat in categories %}
      <optgroup label="{{ cat.label }}">
        {% for pb in cat.playbooks %}
        <option value="{{ cat.key }}::{{ pb.file }}" data-vault="{{ 'true' if pb.vault else 'false' }}">{{ pb.label }}（{{ pb.file }}）</option>
        {% endfor %}
      </optgroup>
      {% endfor %}
    </select>
  </label>
  <input type="hidden" name="category" id="category_field">
  <input type="hidden" name="playbook" id="playbook_field">

  <label>対象ホスト（-l 相当。空欄なら全ホスト）
    <input type="text" name="limit" list="hostnames" placeholder="例: ホストA または ホストA:localhost">
  </label>
  <datalist id="hostnames">
    {% for h in hostnames %}<option value="{{ h }}">{% endfor %}
  </datalist>

  <label id="vault_label">Vaultパスワード
    <input type="password" name="vault_password" autocomplete="off">
  </label>

  <button type="submit">実行</button>
</form>

<script>
  const sel = document.getElementById("playbook_select");
  const catField = document.getElementById("category_field");
  const pbField = document.getElementById("playbook_field");
  const vaultLabel = document.getElementById("vault_label");

  function syncFields() {
    const opt = sel.options[sel.selectedIndex];
    if (!opt) return;
    const sep = opt.value.indexOf("::");
    catField.value = opt.value.slice(0, sep);
    pbField.value = opt.value.slice(sep + 2);
    vaultLabel.style.display = (opt.dataset.vault === "true") ? "" : "none";
  }
  sel.addEventListener("change", syncFields);
  syncFields();
</script>
{% endblock %}
