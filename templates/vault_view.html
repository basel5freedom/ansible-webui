{% extends "base.html" %}
{% block title %}vault編集 - Ansible WebUI{% endblock %}
{% block content %}
<h1>Vault編集（復号して表示）</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/vault/view">
  <label>Vaultパスワード <input type="password" name="password" required autocomplete="off"></label>
  <button type="submit">復号して表示</button>
</form>
{% endblock %}
