{% extends "base.html" %}
{% block title %}hosts編集 - Ansible WebUI{% endblock %}
{% block content %}
<h1>インベントリ（hosts）編集</h1>
{% if saved %}<p class="success">保存しました。</p>{% endif %}
{% if error %}<p class="error">検証エラーのため保存していません:<br><pre>{{ error }}</pre></p>{% endif %}
<form method="post" action="/hosts">
  <textarea name="content" rows="30" style="width:100%; font-family: monospace;">{{ content }}</textarea>
  <p><button type="submit">保存（ansible-inventoryで検証後、自動バックアップしてから反映）</button></p>
</form>
{% endblock %}
