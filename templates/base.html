<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ansible WebUI{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  {% if user %}
  <nav class="nav">
    <a href="/">ダッシュボード</a>
    <a href="/run">実行</a>
    <a href="/jobs">ジョブ一覧</a>
    <a href="/scripts">一括更新スクリプト</a>
    <a href="/hosts">hosts編集</a>
    <a href="/vault">vault編集</a>
    <span class="nav-user">{{ user }}</span>
    <a href="/logout">ログアウト</a>
  </nav>
  {% endif %}
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
